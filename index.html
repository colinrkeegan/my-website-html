  <script>
        var offset = 5;
        var mydivs = document.getElementsByClassName("mydiv");
        var navWrap = document.getElementById("construct-content");
        var navWrapCoord = navWrap.offsetLeft;
        for (var i = 0; i < mydivs.length; i++) {
          dragElement(mydivs[i]);
          mydivs[i].style.left = offset + "px";
          offset = offset + mydivs[i].offsetWidth + 5;
        }

        // 0 = websites
        // 1 = games
        // 2 = photos
        // 3 = music
        // 4 = contact

        mydivs[0].style.left = (navWrap.offsetLeft - 200) + "px";
        mydivs[0].style.top = (navWrap.offsetTop - 150) + "px";

        mydivs[1].style.left = (navWrap.offsetLeft + 260) + "px";
        mydivs[1].style.top = (navWrap.offsetTop - 100) + "px";

        mydivs[2].style.left = (navWrap.offsetLeft - 150) + "px";
        mydivs[2].style.top = (navWrap.offsetTop + 139) + "px";

        mydivs[3].style.left = (navWrap.offsetLeft + 260) + "px";
        mydivs[3].style.top = (navWrap.offsetTop + 170) + "px";

        mydivs[4].style.left = (navWrap.offsetLeft + 35) + "px";
        mydivs[4].style.top = (navWrap.offsetTop + 265) + "px";

        // mydivs[0].style.bottom = 300 + "px";
  
        function dragElement(elmnt) {
          var pos1 = 0,
            pos2 = 0,
            pos3 = 0,
            pos4 = 0;
          if (elmnt.getElementsByClassName("mydivheader")[0]) {
  
            elmnt.getElementsByClassName("mydivheader")[0].onmousedown =
              dragMouseDown;
          } else {
  
            elmnt.onmousedown = dragMouseDown;
          }
  
          function dragMouseDown(e) {
            e = e || window.event;
            e.preventDefault();
         
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
  
            document.onmousemove = elementDrag;
          }
  
          function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
           
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
    
            elmnt.style.top = elmnt.offsetTop - pos2 + "px";
            elmnt.style.left = elmnt.offsetLeft - pos1 + "px";
          }
  
          function closeDragElement() {
  
            document.onmouseup = null;
            document.onmousemove = null;
          }
        }
  
  document.addEventListener("DOMContentLoaded", function () {
          const resetButton = document.getElementById("ResetButton");
          var mydivs = document.getElementsByClassName("mydiv");
          const testButton = document.getElementById("TestButton");
          const coordsSpan = document.getElementById("CoordsSpan");
  
         const offsetAmount = 160;
  
          for (var i = 0; i < mydivs.length; i++) {
            mydivs[i].style.top = resetButton.offsetTop + 50 + "px";
            mydivs[i].style.left =
              resetButton.offsetLeft + i * offsetAmount + "px";
          }
  
          resetButton.addEventListener("click", function () {
            mydivs[0].style.top = resetButton.offsetTop + 50 + "px";
            mydivs[0].style.left = resetButton.offsetLeft - 0 + "px";
  
            for (var i = 1; i < mydivs.length; i++) {
              mydivs[i].style.top = resetButton.offsetTop + 50 + "px";
              mydivs[i].style.left =
                resetButton.offsetLeft + i * offsetAmount + "px";
            }
          });
        
          TestButton.addEventListener("click", function () {
            coordsSpan.innerHTML =
             "Top1 =" + mydivs[0].offsetTop + "px Left1 = " + mydivs[0].offsetLeft +
              "px" +
              "&nbsp|&nbsp" +
              "Top2 =" +
              mydivs[1].offsetTop +
              "px Left2 = " +
              mydivs[1].offsetLeft +
              "px" +
              "&nbsp|&nbsp" +
              "Top3 =" +
              mydivs[2].offsetTop +
              "px Left3 = " +
              mydivs[2].offsetLeft +
              "px" +
              "&nbsp|&nbsp" +
              "Top4 =" +
              mydivs[3].offsetTop +
              "px Left4 = " +
              mydivs[3].offsetLeft +
              "px";
          });
        });
      </script>
